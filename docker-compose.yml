# Postgres only. Next runs on the host under systemd (see deploy/dor-quiz.service)
# and Caddy proxies to it, so this file owns exactly one thing.
#
# The port binding is deliberately `127.0.0.1:5432` and not `5432`. Docker writes
# its own iptables rules that are evaluated BEFORE ufw's, so a bare `5432:5432`
# publishes the database to the public internet even on a box where ufw claims
# to deny everything but 22/80/443. Do not shorten this line.
services:
  db:
    image: postgres:16-alpine
    container_name: gdg-quiz-db
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: gdg_quiz
      POSTGRES_USER: gdg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - gdg-quiz-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gdg -d gdg_quiz']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gdg-quiz-data:
